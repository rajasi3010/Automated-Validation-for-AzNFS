name: Chain watchdog - phase hand-off

# Phase 2 fires on Phase 1's workflow_run; Phase 3 on Phase 2's. That event is
# best-effort, so a dropped event silently skips the next phase and no e-mail is
# sent. This watchdog runs hourly and e-mails when an upstream phase succeeded
# but the next did not start within CHAIN_GRACE_MIN. Assumes phases are healthy.
on:
  schedule:
    - cron: "30 06 * * *"   # ~3h after the 03:30 scan; covers the full chain
  workflow_dispatch:

permissions:
  actions: read
  contents: write

# Cache adoption can initialize the shared database, so queue behind any phase
# that may be reading or writing the same file.
concurrency:
  group: marketplace-db
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on:
      - self-hosted
      - azure-vm-marketplace
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The watchdog normally reads the DB to regenerate the status page. On a
      # fresh runner it may initialize the shared copy from the cache first.
      - name: Locate the shared database
        id: db
        run: |
          mkdir -p "$HOME/aznfs-state"
          echo "DB_PATH=$HOME/aznfs-state/marketplace.db" >> "$GITHUB_ENV"
          if [ -s "$HOME/aznfs-state/marketplace.db" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore database cache (only when the runner has no copy)
        if: steps.db.outputs.present == 'false'
        uses: actions/cache/restore@v4
        with:
          path: marketplace.db
          key: marketplace-db-v2-${{ github.run_id }}
          restore-keys: |
            marketplace-db-v2-

      - name: Adopt a restored cache
        if: steps.db.outputs.present == 'false'
        run: |
          if [ -s marketplace.db ]; then
            cp marketplace.db "$DB_PATH"
          fi

      - name: Check phase hand-offs
        env:
          PYTHONPATH: scripts
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN_GRACE_MIN: "120"
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_MANAGED_IDENTITY_CLIENT_ID: ${{ vars.AZURE_MANAGED_IDENTITY_CLIENT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_MANAGED_IDENTITY_CLIENT_ID }}
          ACS_ENDPOINT: ${{ vars.ACS_ENDPOINT }}
          ACS_SENDER: ${{ vars.ACS_SENDER }}
          NOTIFY_RECIPIENTS: ${{ vars.NOTIFY_RECIPIENTS }}
        run: python scripts/chain_watchdog.py

      # Daily heartbeat for the status page: Phase 3 is skipped when Phase 2
      # fails, so without this the page could silently go stale for days.
      - name: Publish STATUS.md
        if: always()
        run: bash .github/scripts/publish_status.sh
